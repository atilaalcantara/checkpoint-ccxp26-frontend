name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/atilaalcantara/checkpoint-web
  SSH_TARGET: deploy@oracle.atilaalcantara.com
  # Chave publica do servidor (nao e segredo): ssh-keyscan -t ed25519 oracle.atilaalcantara.com
  KNOWN_HOST: oracle.atilaalcantara.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOyLkQWog66Y5uXF5pBwM0Q5WsggzfB8P9KB/Rgx788e

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Em PR so valida o build (astro check + build); na main tambem publica.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          build-args: PUBLIC_PRIVACY_EMAIL=${{ vars.PUBLIC_PRIVACY_EMAIL }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy via SSH
        if: github.event_name == 'push'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$SSH_TARGET" bash -s -- "$IMAGE:$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          IMG="$1"
          docker pull "$IMG"
          docker rm -f checkpoint-web >/dev/null 2>&1 || true
          docker run -d --name checkpoint-web --restart unless-stopped \
            --network shared-net --memory 128m --cpus 0.25 "$IMG" >/dev/null
          for i in $(seq 1 20); do
            status=$(docker inspect -f '{{.State.Health.Status}}' checkpoint-web)
            [ "$status" = healthy ] && { echo "checkpoint-web healthy: $IMG"; docker image prune -f >/dev/null; exit 0; }
            sleep 3
          done
          docker logs --tail 50 checkpoint-web
          exit 1
          REMOTE

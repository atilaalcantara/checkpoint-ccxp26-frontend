# Nginx do container do frontend. TLS e dominio ficam no nginx-proxy do servidor.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml font/woff2 text/xml application/xml;

  # API (container checkpoint-api na shared-net). Resolve o nome em runtime,
  # entao o front sobe mesmo se a API ainda nao existir.
  resolver 127.0.0.11 valid=10s ipv6=off;
  location = /admin/auth-test { return 404; }
  location ^~ /admin/auth-test/ { return 404; }
  location /api/ {
    limit_req zone=api burst=60 nodelay;
    client_max_body_size 11m;
    set $api http://checkpoint-api:8080;
    proxy_pass $api;
    proxy_set_header Host $host;
    # O nginx-proxy do servidor injeta o IP real em X-Forwarded-For.
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }

  location ~* ^/(_astro|assets)/ {
    include /etc/nginx/snippets/checkpoint-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ~* ^/(favicon\.svg|licenses/) {
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/checkpoint-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
